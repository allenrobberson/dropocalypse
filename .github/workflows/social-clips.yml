name: Social clips

# Records vertical 9:16 clips from the real Linux app for social posts. The music and the list of
# clips (clips.txt) come from a separate branch, so audio files never land on main. The clips are
# uploaded as a workflow artifact; nothing is committed.
on:
  workflow_dispatch:
    inputs:
      assets_branch:
        description: "Branch with clips.txt and the audio files"
        required: true
        default: "social-assets"

permissions:
  contents: read

jobs:
  clips:
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          ref: ${{ inputs.assets_branch }}
          path: assets

      - name: Install tools
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential cmake pkg-config ninja-build \
            libgl-dev libpulse-dev libcurl4-openssl-dev \
            libx11-dev libxrandr-dev libxinerama-dev libxcursor-dev libxi-dev libxext-dev \
            libwayland-dev libxkbcommon-dev wayland-protocols extra-cmake-modules \
            xvfb mesa-utils libgl1-mesa-dri fonts-dejavu-core \
            pulseaudio pulseaudio-utils ffmpeg python3-numpy

      - name: Build projectM and the app
        run: |
          scripts/build-projectm.sh build/projectm
          cmake -S linux -B build-linux -G Ninja -DCMAKE_BUILD_TYPE=Release -DAPP_VERSION=0.0.0-dev.clips
          cmake --build build-linux --target dropocalypse
          cp -P build/projectm/lib/libprojectM-4.so* build-linux/

      - name: Record the clips
        run: scripts/make-social-clips.sh assets/clips.txt assets/audio out

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: social-clips
          path: out
          retention-days: 7
