name: Build

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:
    inputs:
      release_version:
        description: "Publish a release with this version (e.g. 0.2.0). Leave empty to just build."
        required: false
        default: ""

permissions:
  contents: read

env:
  # Version for this run: the manual input, else the tag name, else empty (dev build).
  RELEASE_VERSION: ${{ inputs.release_version || (startsWith(github.ref, 'refs/tags/v') && github.ref_name) || '' }}

jobs:
  macos:
    name: macOS app
    runs-on: macos-15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          fetch-depth: 0

      - name: Show toolchain
        run: |
          sw_vers
          xcodebuild -version
          swift --version

      - name: What's New notes are up to date (and cover the version being released)
        run: |
          python3 scripts/make-whats-new.py --check
          if [ -n "$RELEASE_VERSION" ]; then python3 scripts/make-whats-new.py --has "${RELEASE_VERSION#v}"; fi
          python3 scripts/make-milkdrop-bundle.py --check

      - name: Build projectM (MilkDrop engine)
        run: scripts/build-projectm.sh build/projectm

      - name: Test
        run: swift test

      - name: Check Metal shaders compile
        run: |
          awk '/\/\/ METAL-BEGIN/{flag=1;next}/\/\/ METAL-END/{flag=0}flag' \
            Sources/Dropocalypse/Render/ShaderSource.swift > /tmp/Shaders.metal
          if ! xcrun -sdk macosx metal -c /tmp/Shaders.metal -o /tmp/Shaders.air 2>/tmp/metal-err.txt; then
            if grep -qi "missing metal toolchain\|cannot execute tool 'metal'\|toolchain" /tmp/metal-err.txt; then
              echo "Metal toolchain not installed on this runner; downloading it"
              xcodebuild -downloadComponent MetalToolchain || true
              xcrun -sdk macosx metal -c /tmp/Shaders.metal -o /tmp/Shaders.air
            else
              cat /tmp/metal-err.txt
              exit 1
            fi
          fi
          echo "Shaders OK"

      - name: Set up signing
        env:
          MAC_DIST_P12: ${{ secrets.MAC_DIST_P12 }}
          MAC_INSTALLER_P12: ${{ secrets.MAC_INSTALLER_P12 }}
          DEVELOPER_ID_P12: ${{ secrets.DEVELOPER_ID_P12 }}
          P12_PASSWORD: ${{ secrets.P12_PASSWORD }}
          ASC_KEY_P8: ${{ secrets.ASC_KEY_P8 }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
          ASC_KEY_ID: AAX8B3U4QH
          MAC_PROVISION_PROFILE: ${{ secrets.MAC_PROVISION_PROFILE }}
        run: bash scripts/ci-mac-signing.sh

      - name: Build app (GitHub download)
        env:
          NOTARY_KEY_ID: AAX8B3U4QH
          NOTARY_ISSUER: ${{ secrets.ASC_ISSUER_ID }}
        run: |
          VERSION="${RELEASE_VERSION#v}"
          [ -z "$VERSION" ] && VERSION="0.0.0-dev.${GITHUB_RUN_NUMBER}"
          export VERSION
          if [ "${SIGNING_READY:-}" = "1" ] && [ -n "${DEVID_IDENTITY:-}" ]; then
            export SIGN_IDENTITY="$DEVID_IDENTITY"
            # Notarize only real releases (it takes a few minutes).
            [ -n "${RELEASE_VERSION}" ] || unset NOTARY_KEY
          elif [ -n "${RELEASE_VERSION}" ]; then
            echo "::error::This is a release build but Developer ID signing is not set up. Refusing to publish an unsigned Mac app."
            exit 1
          fi
          chmod +x scripts/build-app.sh
          ./scripts/build-app.sh

      - name: Build app (Mac App Store)
        if: env.SIGNING_READY == '1' && env.PROVISION_PROFILE != ''
        run: |
          VERSION="${RELEASE_VERSION#v}"
          [ -z "$VERSION" ] && VERSION="0.0.0"
          EDITION=appstore SIGN_IDENTITY="$DIST_IDENTITY" VERSION="$VERSION" ./scripts/build-app.sh

      - name: Upload to App Store Connect
        # The package is still built and attached to the GitHub release. It is not sent to
        # App Store Connect unless SUBMIT_MAC_APP_STORE is set to true on the repository.
        if: env.SIGNING_READY == '1' && env.PROVISION_PROFILE != '' && env.RELEASE_VERSION != '' && vars.SUBMIT_MAC_APP_STORE == 'true'
        env:
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
        run: |
          xcrun altool --upload-app --type macos --file dist-appstore/*.pkg \
            --apiKey AAX8B3U4QH --apiIssuer "$ASC_ISSUER_ID" --output-format normal

      - name: Upload macOS build
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: Dropocalypse-macOS
          path: |
            dist/*.zip
            dist/*.dmg

      - name: Upload App Store package
        if: env.SIGNING_READY == '1' && env.PROVISION_PROFILE != ''
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: Dropocalypse-AppStore
          path: dist-appstore/*.pkg

  windows:
    name: Windows app (portable)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Build projectM (MilkDrop engine)
        shell: pwsh
        run: ./scripts/build-projectm.ps1 -Prefix build/projectm

      - name: Check HLSL shaders compile
        shell: pwsh
        run: |
          $src = Get-Content windows/src/shaders.h -Raw
          $hlsl = [regex]::Match($src, '(?s)// HLSL-BEGIN(.*)// HLSL-END').Groups[1].Value
          Set-Content -Path "$env:RUNNER_TEMP/shaders.hlsl" -Value $hlsl
          $fxc = Get-ChildItem "${env:ProgramFiles(x86)}\Windows Kits\10\bin" -Recurse -Filter fxc.exe |
                 Where-Object { $_.FullName -match '\\x64\\' } | Sort-Object FullName | Select-Object -Last 1
          if (-not $fxc) { Write-Host "fxc.exe not found; skipping offline shader check"; exit 0 }
          $entries = @(
            @('vs_fullscreen','vs_5_0'), @('vs_geom','vs_5_0'), @('vs_signal','vs_5_0'), @('vs_logo','vs_5_0'),
            @('fs_warp','ps_5_0'), @('fs_geom','ps_5_0'), @('fs_present','ps_5_0'), @('fs_logo','ps_5_0'))
          foreach ($e in $entries) {
            & $fxc.FullName /nologo /T $e[1] /E $e[0] /Fo "$env:RUNNER_TEMP/$($e[0]).cso" "$env:RUNNER_TEMP/shaders.hlsl"
            if ($LASTEXITCODE -ne 0) { throw "Shader $($e[0]) failed to compile" }
          }
          Write-Host "Shaders OK"

      - name: Configure
        shell: pwsh
        run: |
          $v = "$env:RELEASE_VERSION".TrimStart('v')
          if (-not $v) { $v = "0.0.0-dev.$env:GITHUB_RUN_NUMBER" }
          "APP_VERSION=$v" | Out-File -FilePath $env:GITHUB_ENV -Append
          cmake -S windows -B build -A x64 "-DAPP_VERSION=$v"

      - name: Build
        run: cmake --build build --config Release --parallel

      - name: Put the MilkDrop engine beside the exe
        shell: pwsh
        run: Copy-Item build/projectm/bin/*.dll build/Release/

      - name: Test
        run: ctest --test-dir build -C Release --output-on-failure

      - name: Package portable zip
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path package/Dropocalypse | Out-Null
          Copy-Item build/Release/Dropocalypse.exe package/Dropocalypse/
          Copy-Item build/Release/*.dll package/Dropocalypse/
          Copy-Item milkdrop/CREDITS.md package/Dropocalypse/MilkDrop-credits.txt
          Copy-Item windows/README.txt package/Dropocalypse/README.txt
          Copy-Item LICENSE package/Dropocalypse/LICENSE.txt
          $gv = (Get-Content docs/guide-version.txt -ErrorAction SilentlyContinue | Select-Object -First 1)
          if ("${{ inputs.release_version }}" -ne "" -and $gv -ne $env:APP_VERSION) {
            Write-Output "::warning::User Guide says version $gv but this release is $env:APP_VERSION. Run scripts/make-guide.py and commit the PDF."
          }
          Copy-Item docs/Dropocalypse-User-Guide.pdf "package/Dropocalypse/Dropocalypse User Guide.pdf"
          New-Item -ItemType Directory -Force -Path dist | Out-Null
          Copy-Item docs/Dropocalypse-User-Guide.pdf dist/Dropocalypse-User-Guide.pdf
          Compress-Archive -Path package/Dropocalypse -DestinationPath "dist/Dropocalypse-$env:APP_VERSION-Windows-portable.zip" -Force
          Get-ChildItem dist

      - name: Upload Windows build
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: Dropocalypse-Windows
          path: |
            dist/*.zip
            dist/*.pdf

      # ---- Microsoft Store edition: same app without the built-in updater, packaged as MSIX.
      # The Store signs the package itself, so it is left unsigned here. Identity values come from
      # Partner Center (Product identity, Store ID 9N1TJ9D5R5C8); repository variables can override them.
      - name: Build Microsoft Store edition
        shell: pwsh
        run: |
          # Store packages need a plain version. Releases use theirs; other builds use the newest
          # Changelog version (docs/guide-version.txt), so a package can go to the Store any time.
          $sv = "$env:APP_VERSION"
          if ($sv -match '-dev') { $sv = (Get-Content docs/guide-version.txt | Select-Object -First 1).Trim() }
          "STORE_VERSION=$sv" | Out-File -FilePath $env:GITHUB_ENV -Append
          cmake -S windows -B build-store -A x64 "-DAPP_VERSION=$sv" -DDROPOCALYPSE_STORE=ON
          if ($LASTEXITCODE -ne 0) { throw "configure failed" }
          cmake --build build-store --config Release --parallel
          if ($LASTEXITCODE -ne 0) { throw "build failed" }
          Copy-Item build/projectm/bin/*.dll build-store/Release/

      - name: Package MSIX for the Microsoft Store
        shell: pwsh
        env:
          STORE_IDENTITY_NAME: ${{ vars.STORE_IDENTITY_NAME }}
          STORE_PUBLISHER: ${{ vars.STORE_PUBLISHER }}
          STORE_PUBLISHER_DISPLAY_NAME: ${{ vars.STORE_PUBLISHER_DISPLAY_NAME }}
        run: |
          Set-ExecutionPolicy -Scope Process Bypass -Force
          ./scripts/package-store-msix.ps1 -Version $env:STORE_VERSION -ExePath build-store/Release/Dropocalypse.exe

      - name: Upload Microsoft Store package
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: Dropocalypse-Microsoft-Store
          path: store-dist/*.msix

  linux:
    name: Linux app (AppImage)
    runs-on: ubuntu-22.04   # oldest supported base, so the AppImage runs on older distributions too
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Install build tools
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential cmake pkg-config ninja-build file \
            libgl-dev libpulse-dev libcurl4-openssl-dev \
            libx11-dev libxrandr-dev libxinerama-dev libxcursor-dev libxi-dev libxext-dev \
            libwayland-dev libxkbcommon-dev wayland-protocols extra-cmake-modules \
            glslang-tools xvfb mesa-utils libgl1-mesa-dri fonts-dejavu-core imagemagick

      - name: Check GLSL shaders compile
        run: |
          python3 - <<'PY'
          import re, subprocess, sys, pathlib
          src = pathlib.Path("linux/src/shaders.h").read_text()
          blocks = dict(re.findall(r'static const char\* (k\w+) = R"GLSL\((.*?)\)GLSL";', src, re.S))
          ok = True
          for name, text in blocks.items():
              if name == "kLogoBlock":
                  continue
              text = text.replace("#include LOGO_BLOCK", blocks["kLogoBlock"])
              stage = "vert" if name.endswith("VS") else "frag"
              path = pathlib.Path(f"/tmp/{name}.{stage}")
              path.write_text(text)
              r = subprocess.run(["glslangValidator", str(path)], capture_output=True, text=True)
              print(name, "OK" if r.returncode == 0 else "FAILED")
              if r.returncode != 0:
                  print(r.stdout, r.stderr)
                  ok = False
          sys.exit(0 if ok else 1)
          PY

      - name: Build projectM (MilkDrop engine)
        run: scripts/build-projectm.sh build/projectm

      - name: Configure
        run: |
          v="${RELEASE_VERSION#v}"
          if [ -z "$v" ]; then v="0.0.0-dev.$GITHUB_RUN_NUMBER"; fi
          echo "APP_VERSION=$v" >> "$GITHUB_ENV"
          cmake -S linux -B build-linux -G Ninja -DCMAKE_BUILD_TYPE=Release -DCMAKE_INSTALL_PREFIX=/usr "-DAPP_VERSION=$v"

      - name: Build
        run: |
          cmake --build build-linux
          # The MilkDrop engine sits beside the program (dropocalypse looks there first).
          cp -P build/projectm/lib/libprojectM-4.so* build-linux/

      - name: Unit tests (shared update, auto-cycle and layout rules)
        run: ./build-linux/dropocalypse_tests

      - name: Self-test under a virtual display
        run: |
          xvfb-run -a -s "-screen 0 1280x720x24" ./build-linux/dropocalypse --self-test=selftest.ppm
          convert selftest.ppm -resize 50% selftest.png
          mkdir -p selftest && mv selftest.png selftest/
          # Several logos and text items: a row in landscape, then a column in portrait.
          for frame in 0 1; do
            rm -rf /tmp/dropocalypse-selftest && mkdir -p /tmp/dropocalypse-selftest/dropocalypse
            printf 'sceneIndex=5\nportrait=%s\nitems=3\nitem0.kind=image\nitem0.file=%s\nitem0.name=icon\nitem1.kind=text\nitem1.text=DJ NIGHT\nitem1.font=1\nitem1.color=1\nitem2.kind=text\nitem2.text=Fridays · 10pm\nitem2.font=2\nitem2.color=2\n' \
              "$frame" "$PWD/linux/dropocalypse.png" > /tmp/dropocalypse-selftest/dropocalypse/settings.ini
            xvfb-run -a -s "-screen 0 1280x720x24" ./build-linux/dropocalypse --self-test=items$frame.ppm | tee items$frame.log
            grep -q "items 3" items$frame.log || { echo "expected 3 items on screen"; exit 1; }
            convert items$frame.ppm -resize 50% selftest/items-$([ $frame = 1 ] && echo portrait || echo landscape).png
          done
          # The five newest built-in styles, with the logo split into layers.
          i=26
          for name in "Monstercat Bars" "Lo-fi Chill" "Glitch VHS" "Liquid Chrome" "Kinetic Text"; do
            rm -rf /tmp/dropocalypse-selftest && mkdir -p /tmp/dropocalypse-selftest/dropocalypse
            printf 'sceneIndex=%s\nautoCycle=0\nlayerMode=3\nitems=1\nitem0.kind=text\nitem0.text=DROP\nitem0.font=1\nitem0.color=1\n' \
              "$i" > /tmp/dropocalypse-selftest/dropocalypse/settings.ini
            xvfb-run -a -s "-screen 0 1280x720x24" ./build-linux/dropocalypse --self-test=style$i.ppm | tee style$i.log
            grep -q "style $name" style$i.log || { echo "expected the $name style"; exit 1; }
            convert style$i.ppm -resize 50% "selftest/style-$i.png"
            convert style$i.ppm -format "$name frame mean brightness %[fx:mean]\n" info:
            i=$((i+1))
          done
          # A bundled MilkDrop preset (style 32, Acid Mandala) through projectM.
          rm -rf /tmp/dropocalypse-selftest && mkdir -p /tmp/dropocalypse-selftest/dropocalypse
          printf 'sceneIndex=31\nautoCycle=0\n' > /tmp/dropocalypse-selftest/dropocalypse/settings.ini
          xvfb-run -a -s "-screen 0 1280x720x24" ./build-linux/dropocalypse --self-test=milk.ppm | tee milk.log
          grep -q "milkdrop on (9 presets)" milk.log || { echo "MilkDrop presets did not load"; exit 1; }
          grep -q "style Acid Mandala" milk.log || { echo "expected the Acid Mandala style"; exit 1; }
          convert milk.ppm -resize 50% selftest/milkdrop.png
          convert milk.ppm -format "milkdrop frame mean brightness %[fx:mean]\n" info:

      - name: Upload self-test picture
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: Linux-self-test
          path: selftest/

      - name: Package AppImage and tar.gz
        run: |
          DESTDIR="$PWD/AppDir" cmake --install build-linux
          wget -q https://github.com/linuxdeploy/linuxdeploy/releases/download/continuous/linuxdeploy-x86_64.AppImage
          sha256sum linuxdeploy-x86_64.AppImage   # logged so the packaging tool used is on record
          chmod +x linuxdeploy-x86_64.AppImage
          mkdir -p dist
          export LDAI_OUTPUT="dist/Dropocalypse-$APP_VERSION-Linux-x86_64.AppImage"
          export APPIMAGE_EXTRACT_AND_RUN=1
          mkdir -p AppDir/usr/lib && cp -P build/projectm/lib/libprojectM-4.so* AppDir/usr/lib/
          ./linuxdeploy-x86_64.AppImage --appdir AppDir \
            --desktop-file linux/dropocalypse.desktop --icon-file linux/dropocalypse.png --output appimage
          # Plain archive for people who prefer not to use AppImages.
          mkdir -p "pkg/Dropocalypse-$APP_VERSION-Linux"
          cp build-linux/dropocalypse linux/dropocalypse.desktop linux/dropocalypse.png LICENSE "pkg/Dropocalypse-$APP_VERSION-Linux/"
          cp -P build/projectm/lib/libprojectM-4.so* "pkg/Dropocalypse-$APP_VERSION-Linux/"
          cp milkdrop/CREDITS.md "pkg/Dropocalypse-$APP_VERSION-Linux/MilkDrop-credits.txt"
          cp linux/README.txt "pkg/Dropocalypse-$APP_VERSION-Linux/README.txt"
          cp docs/Dropocalypse-User-Guide.pdf "pkg/Dropocalypse-$APP_VERSION-Linux/Dropocalypse User Guide.pdf"
          tar -C pkg -czf "dist/Dropocalypse-$APP_VERSION-Linux-x86_64.tar.gz" "Dropocalypse-$APP_VERSION-Linux"
          ls -la dist

      - name: Upload Linux build
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: Dropocalypse-Linux
          path: |
            dist/*.AppImage
            dist/*.tar.gz

  release:
    name: Publish release
    needs: [macos, windows, linux]
    if: startsWith(github.ref, 'refs/tags/v') || inputs.release_version != ''
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          sparse-checkout: scripts

      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          path: dist
          merge-multiple: true

      - run: ls -la dist

      - name: Checksums for the in-app updater
        run: |
          cd dist
          shopt -s nullglob
          files=(*.zip *.dmg *.AppImage *.tar.gz *.pdf *.msix *.pkg)
          if [ ${#files[@]} -eq 0 ]; then
            echo "::error::No release files were produced."
            exit 1
          fi
          sha256sum "${files[@]}" > SHA256SUMS.txt
          cat SHA256SUMS.txt

      - name: Publish GitHub release
        uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65 # v2.6.2
        with:
          tag_name: ${{ inputs.release_version != '' && format('v{0}', inputs.release_version) || github.ref_name }}
          name: ${{ inputs.release_version != '' && format('Dropocalypse {0}', inputs.release_version) || format('Dropocalypse {0}', github.ref_name) }}
          target_commitish: ${{ github.sha }}
          files: |
            dist/*.zip
            dist/*.dmg
            dist/*.AppImage
            dist/*.tar.gz
            dist/*.pdf
            dist/*.msix
            dist/*.pkg
            dist/SHA256SUMS.txt
          generate_release_notes: true
          body: |
            ## 📖 User guide
            New here? Download **Dropocalypse-User-Guide.pdf** below. It's a printable, step-by-step guide to installing and
            using Dropocalypse on Mac, Windows and Linux, covering every control, all 26 styles, keyboard shortcuts and troubleshooting.
            (It's also included inside the Mac .dmg, the Windows .zip and the Linux .tar.gz.)

            ## Download

            ### 🍎 Mac
            Download the **macOS .dmg** below, open it, and drag **Dropocalypse** into Applications.
            Works on Apple Silicon and Intel Macs, macOS 13 Ventura or later.

            **Open it.** Dropocalypse is signed and notarized by Apple, so it opens like any other app with no security warning.

            **Listen to Spotify or any app:** click **Audio** in the toolbar and pick the app from the **Listen to** drop-down
            (or **All Mac audio**). No mic or extra software needed; requires macOS 14.2 or later. You can still pick a mic or line-in there too.

            ### 🪟 Windows (portable, no admin rights needed)
            Download the **Windows-portable .zip** below, right-click it → **Extract All**, and run **Dropocalypse.exe**.
            Nothing is installed. Works on Windows 10 and 11 (64-bit).

            **First launch:** Windows may show "Windows protected your PC" because the app isn't code-signed.
            Click **More info → Run anyway**.

            By default the Windows version listens to **what your PC is playing** (Spotify, YouTube, DJ software), so no microphone is needed.
            Switch to a mic or line-in under **Audio** in the toolbar.

            ### 🐧 Linux (AppImage, 64-bit)
            Download the **Linux-x86_64.AppImage** below, make it executable (right-click → Properties → Allow executing, or
            `chmod +x Dropocalypse-*.AppImage`) and open it. Runs on current Ubuntu, Debian, Fedora, Mint, Arch and others with
            X11 or Wayland and PulseAudio or PipeWire. Prefer a plain folder? Use the **Linux-x86_64.tar.gz**.

            By default the Linux version listens to **what the computer is playing**, so no microphone is needed.
            Recording to MP4 needs **ffmpeg** from your package manager.

            ## 🔄 Updating
            Already on 1.0 or later? Open the **Updates** menu in the toolbar, then **Update now**. Dropocalypse checks the download's checksum and, on Mac, its Developer ID signature, then installs this version and reopens (on Linux, the AppImage replaces itself). If a check fails, the app you have is left in place.

            ## 🔏 Code signing policy
            See the [code signing policy](https://github.com/allenrobberson/dropocalypse/blob/main/CODE_SIGNING_POLICY.md) and [privacy policy](https://github.com/allenrobberson/dropocalypse/blob/main/PRIVACY.md).

            ## 💬 Questions or ideas?
            Ask, suggest new styles or share your setup in [Discussions](https://github.com/allenrobberson/dropocalypse/discussions). Found a bug? [Open an issue](https://github.com/allenrobberson/dropocalypse/issues).

            ## ❤️ Support Dropocalypse
            Dropocalypse is free and always will be. If you enjoy it, please consider [sponsoring the project](https://github.com/sponsors/allenrobberson).
            Sponsorships cover the yearly Apple Developer membership that keeps Mac downloads signed and notarized, and the time spent on new styles and features.

      - name: Plain-English download labels and a click-here box
        run: bash scripts/release-friendly.sh "${{ inputs.release_version != '' && inputs.release_version || github.ref_name }}"
        env:
          GH_TOKEN: ${{ github.token }}
