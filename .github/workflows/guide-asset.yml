name: Update guide on release

# Keeps the PDF user guide attached to the latest release in step with docs/, so the release page
# shows the newest guide without making a new release. Runs when the guide changes on main, or by hand.
on:
  push:
    branches: [main]
    paths: [docs/Dropocalypse-User-Guide.pdf]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  upload:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - name: Replace the guide on the latest release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          tag=$(gh release view --json tagName --jq .tagName)
          guide=$(tr -d '[:space:]' < docs/guide-version.txt)
          if [ "v$guide" != "$tag" ]; then
            echo "The guide is for $guide but the latest release is $tag; its release build attaches it."
            exit 0
          fi
          gh release upload "$tag" docs/Dropocalypse-User-Guide.pdf --clobber
          # Keep the release's checksum list right for the new guide.
          mkdir -p sums && cd sums
          if gh release download "$tag" --pattern SHA256SUMS.txt; then
            cp ../docs/Dropocalypse-User-Guide.pdf .
            grep -v ' Dropocalypse-User-Guide.pdf$' SHA256SUMS.txt > new.txt || true
            sha256sum Dropocalypse-User-Guide.pdf >> new.txt
            mv new.txt SHA256SUMS.txt
            cat SHA256SUMS.txt
            gh release upload "$tag" SHA256SUMS.txt --clobber
          fi
          echo "Updated the guide on $tag"
