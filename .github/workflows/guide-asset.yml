name: Update guide on release

# Keeps the PDF user guide attached to the latest release in step with docs/, so the release page
# shows the newest guide without making a new release. Runs when the guide changes on main, or by hand.
on:
  push:
    branches: [main]
    paths: [docs/Dropocalypse-User-Guide.pdf]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  upload:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - name: Replace the guide on the latest release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          tag=$(gh release view --json tagName --jq .tagName)
          gh release upload "$tag" docs/Dropocalypse-User-Guide.pdf --clobber
          echo "Updated the guide on $tag"
